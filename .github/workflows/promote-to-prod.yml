name: Promote to production

on:
  pull_request_target:
    branches:
      - prod
    types:
      - closed

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: pages-production
  queue: max
  cancel-in-progress: false

jobs:
  promote:
    name: Approve and deploy Production
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.head.ref == 'release' ||
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out Prod
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Select eligible release candidate
        id: release
        run: |
          rc_tag="$(git tag --list 'v*-rc.*' --merged HEAD --sort=-v:refname | head -n 1)"
          if [[ -z "$rc_tag" ]]; then
            echo "::error::No release candidate tag exists on the merged Prod history."
            exit 1
          fi

          version="${rc_tag#v}"
          version="${version%-rc.*}"
          tracked_version="$(tr -d '\n' < VERSION)"
          if [[ "$version" != "$tracked_version" ]]; then
            echo "::error::RC $rc_tag does not match VERSION $tracked_version."
            exit 1
          fi
          milestone_number="$(
            git tag -l "$rc_tag" --format='%(contents:subject)' |
              sed -n 's/.*milestone #\([0-9][0-9]*\).*/\1/p'
          )"
          if [[ -z "$milestone_number" ]]; then
            echo "::error::The RC tag does not identify its milestone."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "milestone=${milestone_number}" >> "$GITHUB_OUTPUT"

      - name: Tag production release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            tag_sha="$(git rev-parse "v${VERSION}^{commit}")"
            if [[ "$tag_sha" != "$head_sha" ]]; then
              echo "::error::v${VERSION} exists but does not point to current Prod."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" "$head_sha" -m "Production release v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MILESTONE_NUMBER: ${{ steps.release.outputs.milestone }}
        run: node scripts/release-notes.mjs "$MILESTONE_NUMBER" release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists."
          else
            gh release create "v${VERSION}" \
              --target prod \
              --title "v${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Publish Production Pages snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run environment-pages.yml --ref dev \
          -f source_ref=prod \
          -f snapshot_path="production/v${VERSION}"
