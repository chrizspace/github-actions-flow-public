name: Publish public demo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: environment-pages
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Refresh production snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Refresh production snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run environment-pages.yml --ref prod
