name: Environment Pages

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - dev
      - release
      - prod
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write

concurrency:
  group: environment-pages
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish environment snapshot
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.action != 'closed' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      - name: Set up Node.js
        if: >-
          github.event_name != 'pull_request_target' ||
          github.event.action != 'closed'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build snapshot
        if: >-
          github.event_name != 'pull_request_target' ||
          github.event.action != 'closed'
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref_name }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'pull_request_target' && format('feature-pr-{0}', github.event.pull_request.number) || (github.ref_name == 'prod' && 'production' || github.ref_name) }}
        run: npm run build

      - name: Save snapshot
        if: >-
          github.event_name != 'pull_request_target' ||
          github.event.action != 'closed'
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot"
          cp -R dist/. "$RUNNER_TEMP/snapshot/"

      - name: Check out Pages state
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Update environment path
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            page_path="previews/pr-${PR_NUMBER}"
            feature_path="features/${HEAD_REF//\//-}"
          elif [[ "$REF_NAME" == "prod" ]]; then
            page_path="production"
          elif [[ "$REF_NAME" == "dev" || "$REF_NAME" == "release" ]]; then
            page_path="$REF_NAME"
          else
            page_path="features/${REF_NAME//\//-}"
          fi

          if [[ "$EVENT_NAME" == "pull_request_target" && "$ACTION" == "closed" ]]; then
            rm -rf "$page_path"
            rm -rf "$feature_path"
          else
            rm -rf "$page_path"
            mkdir -p "$page_path"
            cp -R "$RUNNER_TEMP/snapshot/." "$page_path/"
          fi

          rm -rf index.html
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GitHub Actions Flow environments</title></head><body><main><h1>GitHub Actions Flow environments</h1><ul>'
            for path in dev release production previews/* features/*; do
              [[ -f "$path/index.html" ]] || continue
              label="${path//\// /}"
              printf '<li><a href="/github-actions-flow-public/%s/">%s</a></li>\n' "$path" "$label"
            done
            printf '%s\n' '</ul></main></body></html>'
          } > index.html

      - name: Publish Pages state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages state is already current."
            exit 0
          fi
          git commit -m "chore(pages): update ${GITHUB_SHA::12}"
          git push origin HEAD:gh-pages
